<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Econia extraction architecture</title><desc id="desc">Pipeline from multilingual sources to validated economic observations.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071A33"/><stop offset="1" stop-color="#123B5D"/></linearGradient><filter id="sh"><feDropShadow dy="8" stdDeviation="10" flood-opacity=".25"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#FF6558"/></marker><style>.T{font:700 34px Inter,Segoe UI,sans-serif;fill:#fff}.S{font:17px Inter,Segoe UI,sans-serif;fill:#AFC6D8}.H{font:700 18px Inter,Segoe UI,sans-serif;fill:#0B2440}.P{font:14px Inter,Segoe UI,sans-serif;fill:#35536B}.K{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#fff}.L{stroke:#FF6558;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1600" height="720" rx="32" fill="url(#bg)"/><circle cx="1450" cy="80" r="220" fill="#1E6A92" opacity=".18"/><circle cx="130" cy="680" r="250" fill="#FF6558" opacity=".08"/>
<text x="74" y="76" class="T">Traceable extraction, from document structure to economic events</text><text x="74" y="110" class="S">Deterministic semantic binding · lightweight NLP · explicit evidence · human validation</text>
<g filter="url(#sh)">
<g><rect x="74" y="170" width="270" height="180" rx="20" fill="#F8F4EC"/><path d="M74 212V190q0-20 20-20h230q20 0 20 20v22z" fill="#FF6558"/><text x="98" y="198" class="K">1 · INGESTION</text><text x="98" y="248" class="H">PDF · CSV · Free text</text><text x="98" y="282" class="P">Pages, blocks, coordinates</text><text x="98" y="310" class="P">Reading order and language</text></g>
<g><rect x="430" y="170" width="300" height="180" rx="20" fill="#F8F4EC"/><path d="M430 212V190q0-20 20-20h260q20 0 20 20v22z" fill="#177E89"/><text x="454" y="198" class="K">2 · STRUCTURE</text><text x="454" y="248" class="H">Narrative · Tables · Charts</text><text x="454" y="282" class="P">Headings, annexes, footnotes</text><text x="454" y="310" class="P">Dedicated table geometry path</text></g>
<g><rect x="816" y="170" width="330" height="180" rx="20" fill="#F8F4EC"/><path d="M816 212V190q0-20 20-20h290q20 0 20 20v22z" fill="#6B5DD3"/><text x="840" y="198" class="K">3 · SEMANTIC BINDING</text><text x="840" y="248" class="H">Atomic propositions</text><text x="840" y="282" class="P">Indicator · Value · Unit · Period</text><text x="840" y="310" class="P">Geography · Sector · Fact type</text></g>
<g><rect x="1232" y="170" width="294" height="180" rx="20" fill="#F8F4EC"/><path d="M1232 212V190q0-20 20-20h254q20 0 20 20v22z" fill="#D44653"/><text x="1256" y="198" class="K">4 · VALIDATION</text><text x="1256" y="248" class="H">Evidence and confidence</text><text x="1256" y="282" class="P">Validated · Needs review</text><text x="1256" y="310" class="P">Rejected with explicit reason</text></g>
</g>
<path d="M344 260h74" class="L"/><path d="M730 260h74" class="L"/><path d="M1146 260h74" class="L"/>
<g filter="url(#sh)"><rect x="190" y="455" width="360" height="150" rx="22" fill="#fff"/><text x="225" y="500" class="H">Numerical reconciliation</text><text x="225" y="535" class="P">Every number receives a trace outcome.</text><text x="225" y="570" class="P">Extracted · Reviewed · Rejected · Noise</text><rect x="620" y="455" width="360" height="150" rx="22" fill="#fff"/><text x="655" y="500" class="H">Persistent repository</text><text x="655" y="535" class="P">SQLite observations and correction history.</text><text x="655" y="570" class="P">Conflicts · Provenance · Audit logs</text><rect x="1050" y="455" width="360" height="150" rx="22" fill="#fff"/><text x="1085" y="500" class="H">Decision workspace</text><text x="1085" y="535" class="P">Review, series, comparison and export.</text><text x="1085" y="570" class="P">Countries · Regions · Economic groups</text></g>
<path d="M1379 350c0 55-149 70-149 95" class="L"/><path d="M1050 530h-58" class="L"/><path d="M620 530h-58" class="L"/><text x="74" y="675" class="S">French · Arabic · English  |  CPU-friendly  |  No large local LLM required</text>
</svg>
